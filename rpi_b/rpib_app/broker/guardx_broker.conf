# guardx_broker.conf - RPi B mosquitto 브로커 설정 (1단계: 평문)
#
# 배치: sudo cp guardx_broker.conf /etc/mosquitto/conf.d/
#       sudo systemctl restart mosquitto
#
# 브로커는 판단 엔진(rpib_engine)과 별개의 인프라다 - 엔진이 죽어도
# 브로커는 살아있고, 그 역도 성립한다. 엔진도 이 브로커의 클라이언트
# 중 하나(client id "rpib")일 뿐이다.
#
# [단계별 전환 계획]
#  1단계(지금): 평문 1883, 익명 허용 - A/B/C 3대 통신 자체를 먼저 검증
#  2단계:       common/certs/guardx_mtls.conf로 교체 (8883 mTLS).
#               이 파일의 listener를 지우거나 127.0.0.1로 좁혀서
#               로컬(엔진)만 평문, 외부(A/C)는 mTLS로 분리 가능.
#
# 주의: mosquitto는 conf에 listener가 하나라도 있으면 기본 리스너를
# 만들지 않는다. 이 파일이 곧 리스너 전부다.

# 모든 인터페이스에서 평문 수신 (!!! 테스트 전용 - 같은 LAN의 누구든
# 액추에이터 명령을 쏠 수 있는 상태. 2단계 전환 전까지만 !!!)
listener 1883 0.0.0.0
allow_anonymous true

# 접속/구독/발행 로그 (검증 단계에서 유용, 운영 시 축소 검토)
log_type error
log_type warning
log_type notice
connection_messages true
