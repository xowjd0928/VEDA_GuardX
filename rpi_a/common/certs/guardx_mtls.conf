# guardx_mtls.conf - RPi B mosquitto mTLS 리스너 설정
#
# 배치: /etc/mosquitto/conf.d/guardx_mtls.conf 로 복사 후
#       sudo systemctl restart mosquitto
#
# require_certificate true 가 핵심 - 클라이언트도 인증서를 제시해야
# 접속 허용 (이게 없으면 "서버 인증서만 검증하는 TLS"일 뿐 mTLS가 아님)

listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/rpib.crt
keyfile  /etc/mosquitto/certs/rpib.key

require_certificate true
tls_version tlsv1.2

# 클라이언트 인증서의 CN을 그대로 MQTT username으로 사용.
# 이걸 켜두면 나중에 ACL(누가 어느 토픽에 publish/subscribe 가능한지)을
# CN(=rpia/rpic) 기준으로 걸 수 있다. 지금은 ACL 파일 미작성이라
# 모든 인증된 클라이언트가 전체 토픽에 접근 가능한 상태.
use_identity_as_username true

# 평문(1883) 리스너는 별도 유지 여부 결정 필요.
# 지금까지 테스트해온 평문 경로를 완전히 막으려면 이 conf 하나만으로는
# 안 되고, 기존 1883 listener 설정(allow_anonymous 등)을 제거/비활성화
# 해야 함. 과도기엔 평문+TLS 동시 운영도 가능(리스너 포트가 다르므로).
